name: Annotate EPUB

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: 'Path to input EPUB (e.g., epubs/input.epub)'
        required: true
        default: 'epubs/input.epub'
      output_file:
        description: 'Path for output EPUB'
        required: true
        default: 'epubs/annotated.epub'

# Forces runner to execute JavaScript actions on Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  annotate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Process EPUB
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python annotate_epub.py --input "${{ github.event.inputs.input_file }}" --output "${{ github.event.inputs.output_file }}"

      - name: Upload Annotated EPUB
        uses: actions/upload-artifact@v4
        with:
          name: annotated-epub
          path: ${{ github.event.inputs.output_file }}
        run: |
          python annotate_epub.py --input "${{ github.event.inputs.input_file }}" --output "${{ github.event.inputs.output_file }}"

      - name: Upload Annotated EPUB
        uses: actions/upload-artifact@v4
        with:
          name: annotated-epub
          path: ${{ github.event.inputs.output_file }}
